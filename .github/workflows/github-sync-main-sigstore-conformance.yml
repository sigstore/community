name: sync-changes-sigstore-conformance

on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Dry run of the Pulumi changes"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'github-sync/github-data/sigstore-conformance/*.yaml'
      - 'github-sync/Pulumi.github-sigstore-conformance.yaml'

permissions: {}

env:
 GITHUB_OWNER: sigstore-conformance

jobs:
  Update:
    if: github.repository == 'sigstore/community'
    name: sync-changes-sigstore-conformance
    runs-on: ubuntu-latest
    environment: github-sync-preview
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
      id: pulumi-auth
      with:
        organization: sigstore
        requested-token-type: urn:pulumi:token-type:access_token:organization
        export-environment-variables: false

    - uses: sigstore/github-sync@main
      if: ${{ inputs.preview }}
      with:
        work_dir: ./github-sync
        config_directory: ./github-sync/github-data
        stack_name: sigstore/github-sigstore-conformance
        pulumi_access_token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
        pulumi_command: preview
        gh_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: sigstore/github-sync@main
      if: ${{ !inputs.preview }}
      with:
        work_dir: ./github-sync
        config_directory: ./github-sync/github-data
        stack_name: sigstore/github-sigstore-conformance
        pulumi_access_token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
        pulumi_command: up
        gh_token: ${{ secrets.GITHUB_TOKEN }}
