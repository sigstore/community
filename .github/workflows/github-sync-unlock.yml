name: unlock-pulumi-resource

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Pulumi stack name"
        required: true
        default: "sigstore/github-prod"
        type: choice
        options:
          - sigstore/github-prod
          - sigstore/github-sigstore-conformance
      urn:
        description: "Full Pulumi URN of the resource to unlock (e.g. urn:pulumi:github-prod::sigstore-github-sync::github:index/membership:Membership::username)"
        required: true
        type: string

permissions: {}

jobs:
  unlock:
    if: github.repository == 'sigstore/community'
    name: unlock-pulumi-resource
    runs-on: ubuntu-latest
    environment: github-sync-preview
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: sigstore
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

      - name: Unprotect Pulumi resource
        working-directory: ./github-sync
        env:
          STACK_NAME: ${{ inputs.stack }}
          RESOURCE_URN: ${{ inputs.urn }}
        run: |
          set -euo pipefail
          if [[ ! "${RESOURCE_URN}" =~ ^urn:pulumi:[^[:space:]]+$ ]]; then
            echo "::error::Invalid Pulumi URN: ${RESOURCE_URN}"
            exit 1
          fi
          printf 'name: sigstore-github-sync\nruntime: go\ndescription: Sync GitHub users, collaborators and repositories for an organization\n' > Pulumi.yaml
          pulumi state unprotect --stack "${STACK_NAME}" --yes "${RESOURCE_URN}"
