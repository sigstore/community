name: preview-changes

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'github-sync/github-data/sigstore-conformance/*.yaml'
      - 'github-sync/Pulumi.github-sigstore-conformance.yaml'

permissions: {}

env:
 GITHUB_OWNER: sigstore-conformance

jobs:
  preview:
    if: github.repository == 'sigstore/community'
    name: changes-sigstore-conformance
    runs-on: ubuntu-latest
    environment: github-sync-preview

    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
        allow-unsafe-pr-checkout: true
        # Only the org data comes from the PR; stack config is fetched from the
        # base commit by the action.
        sparse-checkout: github-sync/github-data

    - uses: sigstore/github-sync@main
      with:
        work_dir: ./github-sync
        config_directory: ./github-sync/github-data
        stack_name: sigstore/github-sigstore-conformance
        pulumi_access_token: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        pulumi_command: preview
        gh_token: ${{ secrets.GITHUB_TOKEN }}
        comment_on_pr: true
