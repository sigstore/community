name: preview-changes

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'github-sync/github-data/sigstore/*.yaml'
      - 'github-sync/Pulumi.github-prod.yaml'

permissions: {}

env:
 GITHUB_OWNER: sigstore

jobs:
  preview:
    if: github.repository == 'sigstore/community'
    name: changes-sigstore
    runs-on: ubuntu-latest
    environment: github-sync-preview

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
        allow-unsafe-pr-checkout: true
        # Only the org data comes from the PR; stack config is fetched from the
        # base commit by the action.
        sparse-checkout: github-sync/github-data

    - uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
      id: pulumi-auth
      with:
        organization: sigstore
        requested-token-type: urn:pulumi:token-type:access_token:organization
        export-environment-variables: false

    - uses: sigstore/github-sync@main
      with:
        work_dir: ./github-sync
        config_directory: ./github-sync/github-data
        stack_name: sigstore/github-prod
        pulumi_access_token: ${{ steps.pulumi-auth.outputs.pulumi-access-token }}
        pulumi_command: preview
        gh_token: ${{ secrets.GITHUB_TOKEN }}
        comment_on_pr: true
